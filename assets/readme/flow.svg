<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Alur autentikasi dan verifikasi OTP</title><desc id="d">Peramban masuk lewat Firebase Auth, mengirim ID token ke api send-otp, kode dikirim lewat Gmail SMTP, pengguna memasukkan kode ke api verify-otp, lalu cookie kn_verified diberikan dan pengguna lanjut ke checkout.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#AD8A52"/></marker></defs>
<rect width="1200" height="470" rx="24" fill="#F6EEE1"/>
<text x="40" y="46" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="4" font-weight="700" fill="#AD8A52">TAHAP 1  KIRIM KODE</text>
<text x="40" y="262" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="4" font-weight="700" fill="#AD8A52">TAHAP 2  VERIFIKASI</text>
<rect x="40" y="66" width="220" height="84" rx="16" fill="#FBF8F3" stroke="#D8C4A6" stroke-width="1.5"/><text x="150.0" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#29221B">Peramban</text><text x="150.0" y="127" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B4A32">js/auth.js</text>
<rect x="340" y="66" width="220" height="84" rx="16" fill="#FBF8F3" stroke="#D8C4A6" stroke-width="1.5"/><text x="450.0" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#29221B">Firebase Auth</text><text x="450.0" y="127" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B4A32">Email, password, Google</text>
<rect x="640" y="66" width="220" height="84" rx="16" fill="#29221B" stroke="#AD8A52" stroke-width="1.5"/><text x="750.0" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#FBF8F3">POST /api/send-otp</text><text x="750.0" y="127" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#C9AD7C">Cek ID token, buat kode</text>
<rect x="940" y="66" width="220" height="84" rx="16" fill="#FBF8F3" stroke="#D8C4A6" stroke-width="1.5"/><text x="1050.0" y="102" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#29221B">Gmail SMTP</text><text x="1050.0" y="127" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B4A32">smtp.gmail.com:465, TLS</text>
<line x1="266" y1="108" x2="334" y2="108" stroke="#AD8A52" stroke-width="2.2" marker-end="url(#ah)"/><text x="300.0" y="98" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing=".5" fill="#6B4A32">login</text>
<line x1="566" y1="108" x2="634" y2="108" stroke="#AD8A52" stroke-width="2.2" marker-end="url(#ah)"/><text x="600.0" y="98" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing=".5" fill="#6B4A32">ID token</text>
<line x1="866" y1="108" x2="934" y2="108" stroke="#AD8A52" stroke-width="2.2" marker-end="url(#ah)"/><text x="900.0" y="98" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing=".5" fill="#6B4A32">kirim kode</text>
<line x1="1050" y1="158" x2="1050" y2="282" stroke="#AD8A52" stroke-width="2.2" marker-end="url(#ah)"/><text x="1038" y="222" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing=".5" fill="#6B4A32">kode masuk ke inbox</text>
<rect x="40" y="282" width="220" height="84" rx="16" fill="#FBF8F3" stroke="#D8C4A6" stroke-width="1.5"/><text x="150.0" y="318" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#29221B">Lanjut checkout</text><text x="150.0" y="343" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B4A32">Sesi terverifikasi</text>
<rect x="340" y="282" width="220" height="84" rx="16" fill="#29221B" stroke="#AD8A52" stroke-width="1.5"/><text x="450.0" y="318" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#FBF8F3">Cookie kn_verified</text><text x="450.0" y="343" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#C9AD7C">httpOnly, berlaku 12 jam</text>
<rect x="640" y="282" width="220" height="84" rx="16" fill="#FBF8F3" stroke="#D8C4A6" stroke-width="1.5"/><text x="750.0" y="318" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#29221B">POST /api/verify-otp</text><text x="750.0" y="343" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B4A32">Cocokkan kode, maks 5 percobaan</text>
<rect x="940" y="282" width="220" height="84" rx="16" fill="#FBF8F3" stroke="#D8C4A6" stroke-width="1.5"/><text x="1050.0" y="318" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#29221B">Pengguna</text><text x="1050.0" y="343" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6B4A32">Memasukkan kode 6 digit</text>
<line x1="334" y1="324" x2="266" y2="324" stroke="#AD8A52" stroke-width="2.2" marker-end="url(#ah)"/><text x="300.0" y="314" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing=".5" fill="#6B4A32">diberikan</text>
<line x1="634" y1="324" x2="566" y2="324" stroke="#AD8A52" stroke-width="2.2" marker-end="url(#ah)"/><text x="600.0" y="314" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing=".5" fill="#6B4A32">kode benar</text>
<line x1="934" y1="324" x2="866" y2="324" stroke="#AD8A52" stroke-width="2.2" marker-end="url(#ah)"/><text x="900.0" y="314" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" letter-spacing=".5" fill="#6B4A32">kirim kode</text>
<rect x="40" y="396" width="1120" height="52" rx="14" fill="#FBF8F3" stroke="#E4D5BE"/><text x="60" y="427" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#6B4A32">Cookie kn_otp ditandatangani HS256 dan berlaku 5 menit. Kirim ulang kode dibatasi 60 detik. Semua rahasia hanya ada di server.</text></svg>