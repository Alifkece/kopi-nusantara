<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Fitur utama Kopi Nusantara</title><desc id="d">Katalog produk, keranjang dan checkout, pembayaran WhatsApp atau QRIS, akun dan Google login, verifikasi OTP Gmail, video dan animasi halus.</desc>
